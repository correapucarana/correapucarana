<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script>
        window.onload = function () {
            // Obtém o código da URL de redirecionamento
            var urlParams = new URLSearchParams(window.location.search);
            var code = urlParams.get('code');  // Obtém o código

            if (code) {
                // Redireciona de volta para o app Flutter com o código
                window.location.href = "stravaflutter://auth?code=" + code;
            } else {
                // Caso não haja código, redireciona ou exibe erro
                window.location.href = "https://correapucarana.com.br";  // Ou algum erro/aviso
            }
        };
    </script>
</head>

<body>
    <h1>Redirecionando...</h1>
</body>

</html>
